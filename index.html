<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="PersonData" style="font-size: larger;">
        <h1>Dados Pessoais</h1>
        <label for="nome">Nome Completo: </label>
        <input type="text" id="nome">

        <label for="telefone">Telefone: </label>
        <input type="text" id="telefone">

        <label for="endereco">Endereço: </label>
        <input type="text" id="endereco">

        <label for="datan">Data de Nascimento: </label>
        <input type="datetime" id="datan">
    </div>

    <div class="ProfissionalData">
        <h1>Histórico Profissional</h1>
        <label for="empresa">Nome da Empresa: </label>
        <input type="text" id="empresa">

        <label for="dataa">Data de admissão: </label>
        <input type="datetime" id="dataa">

        <label for="datad">Data de Demissão: </label>
        <input type="datetime" id="datad">

        <label for="cargo">Cargo Ocupado: </label>
        <input type="text" id="cargo">

        <label for="cargodesc">Descrição do Cargo: </label>
        <input type="text" id="cargodesc">
    </div>

    <div class="AcademicData">
        <h1>Formação Acadêmica</h1>
        <label for="curso">Nome do Curso</label>
        <input type="text" id="curso">

        <label for="instituicao">instituição</label>
        <input type="text" id="instituicao">
        
        <label for="anoconclusao">Ano de Conclusão</label>
        <input type="text" id="anoconclusao">
    </div>

    <div class="Language">
        <h1>Idiomas</h1>
        <label for="idioma">Nome do Idioma</label>
        <input type="text" id="idioma">

        <label for="nivelproeficiencia">Nível de Proeficiência</label>
        <input type="text" id="nivelproeficiencia">
    </div>

    <div id="Send" class="SendData">
        <button type="button" onclick="enviarFormulario()">Enviar</button>
    </div>
</body>
</html>
